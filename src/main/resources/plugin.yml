name: SyntrixCrate
version: 1.0.0
main: com.syntrixcrate.SyntrixCrate
api-version: 1.20
description: SyntrixCrate - Saját crate plugin
author: TeNevéd

commands:
  crates:
    description: Crate plugin parancsok
    usage: /crates <help|set|remove|give|key|reload|list>
    aliases: [syntrix, sc, cr]

permissions:
  mycrates.admin:
    description: Admin parancsokhoz hozzáférés
    default: op
  mycrates.use:
    description: Ládák használata
    default: true
